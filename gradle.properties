# Project-wide Gradle settings

# JVM Args
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Enable R8 full mode for aggressive optimization
android.enableR8.fullMode=true

# Enable build cache
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Configuration on demand
org.gradle.configureondemand=true

# Signing credentials - DO NOT COMMIT real values
# Set in local.properties (gitignored) or CI environment variables
# RELEASE_STORE_FILE=../release-key.jks
# RELEASE_STORE_PASSWORD=
# RELEASE_KEY_ALIAS=
# RELEASE_KEY_PASSWORD=

# Neon sync database credentials - set via env vars (NEON_PASSWORD) or local.properties
# NEON_HOST=
# NEON_DATABASE=
# NEON_USER=
# NEON_PASSWORD=
